<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>暗記カード｜応用情報技術者試験</title>
<style>
:root {
  --bg: #faf8f8;
  --surface: #ffffff;
  --border: #e5e5e5;
  --muted: #b8b8b8;
  --text: #4e4e4e;
  --strong: #2b2b2b;
  --accent: #284b63;
  --accent-soft: rgba(40, 75, 99, 0.1);
  --known: #2f7a52;
  --unknown: #b5622a;
}
:root[data-theme="dark"] {
  --bg: #161618;
  --surface: #1e1e21;
  --border: #393639;
  --muted: #646464;
  --text: #d4d4d4;
  --strong: #ebebec;
  --accent: #7b97aa;
  --accent-soft: rgba(123, 151, 170, 0.15);
  --known: #6fbf8f;
  --unknown: #d9955f;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP",
               "Yu Gothic", Meiryo, sans-serif;
  line-height: 1.75;
  -webkit-text-size-adjust: 100%;
}

.app {
  max-width: 720px;
  margin: 0 auto;
  padding: 1.25rem 1rem 3rem;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ---- ヘッダー ---- */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}

.cats { display: flex; gap: 0.4rem; flex-wrap: wrap; }

.cat {
  appearance: none;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 0.85rem;
  line-height: 1.4;
  padding: 0.35rem 0.7rem;
  border-radius: 999px;
  cursor: pointer;
  text-decoration: none;
}
.cat:hover { border-color: var(--accent); color: var(--accent); }
.cat[aria-current="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--bg);
}

.icon-btn {
  appearance: none;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 1rem;
  width: 2.25rem;
  height: 2.25rem;
  border-radius: 999px;
  cursor: pointer;
  display: grid;
  place-items: center;
  flex: none;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ---- 進捗 ---- */
.meta {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.75rem;
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 0.4rem;
}
.meta strong { color: var(--text); font-weight: 600; }

.bar {
  height: 4px;
  background: var(--border);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 1.5rem;
}
.bar > i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--accent);
  transition: width 0.25s ease;
}

/* ---- カード ---- */
main { flex: 1 0 auto; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1.75rem 1.5rem;
  cursor: pointer;
  min-height: 13rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1.25rem;
}
.card:hover { border-color: var(--accent); }

.q {
  font-size: 1.15rem;
  color: var(--strong);
  margin: 0;
}

.hint {
  font-size: 0.8rem;
  color: var(--muted);
  text-align: center;
  margin: 0;
}

.answer {
  border-top: 1px dashed var(--border);
  padding-top: 1.25rem;
  animation: fade 0.18s ease;
}
@keyframes fade { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; } }

.term {
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--accent);
  margin: 0;
  line-height: 1.4;
  word-break: break-word;
}
.aliases {
  font-size: 0.85rem;
  color: var(--muted);
  margin: 0.4rem 0 0;
}

/* ---- 操作 ---- */
.controls {
  display: flex;
  gap: 0.6rem;
  margin-top: 1.25rem;
  flex-wrap: wrap;
}
.controls .grow { flex: 1 1 8rem; }

button.act {
  appearance: none;
  font: inherit;
  font-size: 0.95rem;
  padding: 0.7rem 1rem;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
}
button.act:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button.act:disabled { opacity: 0.4; cursor: default; }
button.act.known { border-color: var(--known); color: var(--known); }
button.act.unknown { border-color: var(--unknown); color: var(--unknown); }

.sub {
  display: flex;
  justify-content: space-between;
  gap: 0.6rem;
  margin-top: 0.75rem;
  font-size: 0.85rem;
}
.link {
  appearance: none;
  border: 0;
  background: none;
  font: inherit;
  font-size: 0.85rem;
  color: var(--muted);
  cursor: pointer;
  padding: 0.25rem;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.link:hover { color: var(--accent); }

/* ---- 結果 ---- */
.result {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 2rem 1.5rem;
  text-align: center;
}
.result h2 { margin: 0 0 1.25rem; font-size: 1.2rem; color: var(--strong); }
.score { display: flex; justify-content: center; gap: 2.5rem; margin-bottom: 1.75rem; }
.score div { font-size: 0.85rem; color: var(--muted); }
.score b { display: block; font-size: 2rem; line-height: 1.2; }
.score .k b { color: var(--known); }
.score .u b { color: var(--unknown); }

.empty { text-align: center; color: var(--muted); padding: 3rem 1rem; }

@media (max-width: 480px) {
  .card { padding: 1.5rem 1.15rem; min-height: 11rem; }
  .q { font-size: 1.05rem; }
  .term { font-size: 1.35rem; }
}

/* ---- 埋め込みモード ----
   Quartzのカテゴリページ（暗記カード/11_セキュリティ 等）が、このHTMLをiframeで読み込む。
   カテゴリは親サイドバーで、テーマは親のトグルで選ぶので、自前のヘッダーは隠す。
   背景を透明にして親ページの地色に載せる。 */
html.embed, html.embed body { background: transparent; }
html.embed header { display: none; }
html.embed .app {
  min-height: 0;
  max-width: none;
  padding: 0 0 0.25rem;
}
</style>
</head>
<body>
<div class="app">
  <header>
    <nav class="cats" id="cats"></nav>
    <button class="icon-btn" id="theme" type="button" aria-label="テーマ切替">◐</button>
  </header>

  <div class="meta">
    <span id="catName"></span>
    <span><strong id="pos">0</strong> / <span id="total">0</span></span>
  </div>
  <div class="bar"><i id="bar"></i></div>

  <main>
    <div id="stage"></div>
  </main>
</div>

<script>
const CARDS = [{"q":"分散データベースで、全サイトの合意を確認してから確定する手順。 複数サイトをまたいでACID特性の原子性を保証する。","a":"2相コミット","aliases":["2相コミットメント","ツーフェーズコミット"],"cat":"database"},{"q":"全ロックを獲得してから解放に移る方式。 直列化可能性を保証する。","a":"2相ロッキング","aliases":[],"cat":"database"},{"q":"外部・概念・内部の3つのスキーマに分け、データ独立性を確保する構造。","a":"3層スキーマ","aliases":[],"cat":"database"},{"q":"トランザクションが備えるべき4つの性質。 原子性・一貫性・独立性・耐久性の頭文字。","a":"ACID特性","aliases":["ACID"],"cat":"database"},{"q":"蓄積データを集計・可視化して意思決定を支援するツール。","a":"BIツール","aliases":[],"cat":"database"},{"q":"木構造をたどって目的の行に到達する索引方式。 どの値でも探索の深さが一定で、範囲検索にも強い。","a":"B木索引","aliases":[],"cat":"database"},{"q":"データの定義・操作・制御を一元的に行うデータベース管理システム。","a":"DBMS","aliases":["DataBase Management System"],"cat":"database"},{"q":"SQLの3分類。 定義（CREATE）・操作（SELECT）・制御（GRANT）に対応する。","a":"DDL・DML・DCL","aliases":[],"cat":"database"},{"q":"実体と関連でデータ構造を表す図。 概念データモデルの作成に用いる。","a":"E-R図","aliases":[],"cat":"database"},{"q":"抽出・変換・格納の処理により、業務データを分析基盤へ集約する仕組み。","a":"ETL","aliases":[],"cat":"database"},{"q":"副問合せの結果が1行でも存在するかを判定する述語。","a":"EXISTS述語","aliases":[],"cat":"database"},{"q":"指定した列の値ごとに行をグループ化する句。 集計関数と組み合わせる。","a":"GROUP BY句","aliases":[],"cat":"database"},{"q":"GROUP BY句で作ったグループに対する絞り込み条件を書く句。 WHEREは行に対して働くのに対し、〇〇〇はグループに対して働く。","a":"HAVING句","aliases":["HAVING"],"cat":"database"},{"q":"大量データを多数のサーバで分散並列処理する基盤。 分割して処理し結果を統合するMapReduceを用いる。","a":"Hadoop","aliases":[],"cat":"database"},{"q":"値が不明・未定・非該当であることを表す「状態」。0や空文字とは別物。 比較演算子では判定できず、IS 〇〇〇 を使う。","a":"NULL","aliases":["ナル値","空値"],"cat":"database"},{"q":"関係モデルによらないデータベースの総称。 キーバリュー型・文書型・グラフ型などがある。","a":"NoSQL","aliases":[],"cat":"database"},{"q":"多次元データを対話的に集計・分析する手法。 ドリルダウンやスライシングを行う。","a":"OLAP","aliases":[],"cat":"database"},{"q":"受注や入金など日々の業務処理をその都度確実に処理する形態。 分析中心のOLAPと設計方針が逆になる。","a":"OLTP","aliases":[],"cat":"database"},{"q":"表からデータを取り出すSQL。 WHEREで行を絞り、ORDER BYで並べ替える。","a":"SELECT文","aliases":[],"cat":"database"},{"q":"列の値と、その行の格納位置を対応づけた別の表。検索を高速化する。 ただし更新・挿入・削除は遅くなるため、張り過ぎは逆効果になる。","a":"インデックス","aliases":["索引"],"cat":"database"},{"q":"チェックポイント以降のログで復旧し、システムを再開させる方式。","a":"ウォームスタート","aliases":[],"cat":"database"},{"q":"問合せ結果を1行ずつ取り出して処理するための仕組み。 埋込みSQLで使う。","a":"カーソル","aliases":[],"cat":"database"},{"q":"E-R図における関連の多重度。 1対1・1対多・多対多があり、多対多は連関実体に分解する。","a":"カーディナリティ","aliases":[],"cat":"database"},{"q":"トランザクションの更新を確定させる操作。 取り消す操作がロールバック。","a":"コミット","aliases":[],"cat":"database"},{"q":"データを複数のサーバに水平分割して格納し、負荷を分散させる方式。","a":"シャーディング","aliases":[],"cat":"database"},{"q":"中央の事実表を複数の次元表が囲む、分析用データベースの設計。","a":"スタースキーマ","aliases":[],"cat":"database"},{"q":"データベース側に格納しておく一連の処理手続き。 ネットワーク負荷を減らせる。","a":"ストアドプロシージャ","aliases":[],"cat":"database"},{"q":"他のトランザクションが未確定の更新データを読んでしまう現象。","a":"ダーティリード","aliases":[],"cat":"database"},{"q":"主記憶上の更新を一括して反映し、復旧の起点とする時点。","a":"チェックポイント","aliases":[],"cat":"database"},{"q":"待ちグラフの循環を検出し、一方をロールバックさせて解消する方法。","a":"デッドロックの検知","aliases":[],"cat":"database"},{"q":"意思決定支援のために時系列で蓄積された分析用のデータベース。","a":"データウェアハウス","aliases":[],"cat":"database"},{"q":"大量データから統計・機械学習の手法で規則性や相関を発見すること。","a":"データマイニング","aliases":[],"cat":"database"},{"q":"データウェアハウスから、特定の部門や用途に絞って切り出した小規模なデータベース。","a":"データマート","aliases":[],"cat":"database"},{"q":"加工前の生データをそのままの形式で蓄積する保管場所。","a":"データレイク","aliases":[],"cat":"database"},{"q":"集計結果をより細かい階層に掘り下げて分析する操作。","a":"ドリルダウン","aliases":[],"cat":"database"},{"q":"量・多様性・発生速度の大きいデータ群。 従来の手法では扱いにくい。","a":"ビッグデータ","aliases":[],"cat":"database"},{"q":"実表から導出される仮想的な表。 利用者に必要な列・行だけを見せて機密性も高められる。","a":"ビュー","aliases":[],"cat":"database"},{"q":"同じ検索条件で2回読むと、途中の挿入により行数が変わる現象。","a":"ファントムリード","aliases":[],"cat":"database"},{"q":"すべての決定項が候補キーになっている状態。 第3正規形をさらに厳しくしたもの。","a":"ボイス・コッド正規形","aliases":["BCNF"],"cat":"database"},{"q":"データの意味や形式を説明するデータ。 データ辞書やリポジトリで管理する。","a":"メタデータ","aliases":[],"cat":"database"},{"q":"同じデータの複製を別のサーバに保持し、可用性や参照性能を高める仕組み。","a":"レプリケーション","aliases":[],"cat":"database"},{"q":"2つのトランザクションが同じデータを読み、後から書いた更新が先の更新を上書きして消してしまう現象。 「〇〇〇」ともいう。","a":"ロストアップデート","aliases":["更新の消失","更新喪失"],"cat":"database"},{"q":"ロックをかける単位。 行単位は同時実行性が高く、表単位は管理が容易になる。","a":"ロックの粒度","aliases":[],"cat":"database"},{"q":"トランザクションを開始前の状態へ巻き戻す処理。 更新前ログを使い、ACID特性の原子性を守る。","a":"ロールバック","aliases":["後退復帰"],"cat":"database"},{"q":"媒体障害のとき、バックアップを復元したうえで、更新後ログを適用して障害直前の状態まで進める復旧処理。 ロールバックが「巻き戻す」のに対し、こちらは「もう一度やり直して進める」。","a":"ロールフォワード","aliases":["前進復帰"],"cat":"database"},{"q":"列の値が重複しないことを保証する制約。 主キー以外にも設定できる。","a":"一意性制約","aliases":[],"cat":"database"},{"q":"行を一意に識別する属性。 NULLも重複も許されない。","a":"主キー","aliases":[],"cat":"database"},{"q":"行を一意に識別できる極小の属性の組。 この中から主キーを1つ選ぶ。","a":"候補キー","aliases":[],"cat":"database"},{"q":"記憶装置上での物理的な格納方法を定義するスキーマ。","a":"内部スキーマ","aliases":[],"cat":"database"},{"q":"結合条件を満たす行だけを取り出す結合。 満たさない行も残すのが外部結合。","a":"内部結合","aliases":[],"cat":"database"},{"q":"複数拠点に分散配置されたデータベース。 利用者には1つに見せる透過性が求められる。","a":"分散データベース","aliases":[],"cat":"database"},{"q":"同時実行時に、他のトランザクションの影響をどこまで許すかの段階設定。 ACID特性の独立性を、性能と引き換えにどこまで守るかを選ぶ。","a":"分離性水準","aliases":["分離レベル","隔離性水準","トランザクション分離レベル"],"cat":"database"},{"q":"SQL文の中に入れ子で書くSELECT文。 外側の行の値を使うものを相関〇〇〇という。","a":"副問合せ","aliases":["サブクエリ","副問い合わせ"],"cat":"database"},{"q":"外部キーの値が、参照先の主キーに存在することを保証する制約。","a":"参照整合性制約","aliases":[],"cat":"database"},{"q":"同じ行を2回読む間に他者が更新し、値が変わってしまう現象。","a":"反復不能読み取り","aliases":[],"cat":"database"},{"q":"他の表の主キー（または一意性制約のある列）を参照する属性。 参照整合性制約により、存在しない相手を指す行を作れなくする。","a":"外部キー","aliases":["外部キー制約"],"cat":"database"},{"q":"個々の利用者やアプリから見たデータの見え方を定義するスキーマ。 ビューが対応する。","a":"外部スキーマ","aliases":[],"cat":"database"},{"q":"DBMSのオプティマイザが決めた、索引の使用や結合順序などの処理手順。 統計情報が古いと最適でなくなる。","a":"実行計画","aliases":[],"cat":"database"},{"q":"読み書きとも他から禁止するロック。 共有ロックは読取りのみ許す。","a":"専有ロック","aliases":[],"cat":"database"},{"q":"関係から必要な列だけを取り出す演算（縦に切る）。 行を取り出す演算が選択（横に切る）。","a":"射影","aliases":["射影演算"],"cat":"database"},{"q":"左側の表の行をすべて残し、右側に対応がなければNULLで埋める結合。 対応がある行だけを残す内部結合と対になる。","a":"左外部結合","aliases":["LEFT OUTER JOIN","外部結合"],"cat":"database"},{"q":"複数のトランザクションを同時に動かしても矛盾が起きないようにする制御。 ACID特性の独立性を守る仕組み。","a":"排他制御","aliases":["同時実行制御"],"cat":"database"},{"q":"非キー属性を経由して、別の非キー属性が間接的に決まる従属。 第3正規形で排除する。","a":"推移的関数従属","aliases":[],"cat":"database"},{"q":"列の値が指定した条件を満たすことを強制する制約。","a":"検査制約","aliases":[],"cat":"database"},{"q":"データ全体の論理的な構造を表すスキーマ。 3層スキーマの中核となる。","a":"概念スキーマ","aliases":[],"cat":"database"},{"q":"更新時異状をなくすために、関数従属にもとづいて表を分解していく設計手法。","a":"正規化","aliases":[],"cat":"database"},{"q":"2つの関係のすべての行を総当たりで組み合わせる演算。 結合条件を書き忘れると発生する。","a":"直積","aliases":[],"cat":"database"},{"q":"繰返し項目を排除し、すべての属性が単一値になっている状態。","a":"第1正規形","aliases":[],"cat":"database"},{"q":"第1正規形を満たし、かつすべての非キー属性が主キー全体に完全関数従属している状態。 部分関数従属を排除した形。","a":"第2正規形","aliases":[],"cat":"database"},{"q":"第2正規形を満たし、さらに主キー以外の項目によって決まる項目を分離した状態。 推移的関数従属を取り除いた形。","a":"第3正規形","aliases":[],"cat":"database"},{"q":"複数の属性を組み合わせて主キーとしたもの。 部分関数従属が生じる原因になる。","a":"複合キー","aliases":[],"cat":"database"},{"q":"複合主キーの一部だけで、非キー属性が決まってしまう従属。 第2正規形で排除する。","a":"部分関数従属","aliases":[],"cat":"database"},{"q":"関係（表）に演算を施して、新しい関係を得る理論体系。SQLの土台。 集合演算4つと関係演算4つ、合わせて8つの演算からなる。","a":"関係代数","aliases":[],"cat":"database"},{"q":"ある属性の値が決まると、別の属性の値がただ1つに定まる関係。 A → B と書き、正規化のすべての土台になる。","a":"関数従属","aliases":[],"cat":"database"},{"q":"COUNT・SUM・AVG・MAX・MINなど、複数行を1つの値にまとめる関数。","a":"集約関数","aliases":[],"cat":"database"},{"q":"検索性能のために、あえて重複を許して表を統合したり項目を持たせたりする設計。 更新時の不整合リスクを運用で引き受ける代わりに、速度を得る。","a":"非正規化","aliases":[],"cat":"database"},{"q":"TCPが通信を始めるときに行う、3回のやり取りによる接続確立の手順。 SYN → SYN/ACK → ACK の順で、双方が「送れる」「受け取れる」ことを確認してからデータ転送に入る。","a":"3ウェイハンドシェイク","aliases":["スリーウェイハンドシェイク","3ウェイハンドシェーク"],"cat":"network"},{"q":"高速大容量・低遅延・多数同時接続を特徴とする第5世代移動通信システム。","a":"5G","aliases":[],"cat":"network"},{"q":"IPアドレスからMACアドレスを求めるプロトコル。 同一セグメント内でブロードキャストする。","a":"ARP","aliases":["Address Resolution Protocol"],"cat":"network"},{"q":"誤りを検出したときに再送を要求する方式。 ストップアンドウェイトと連続〇〇〇（ゴーバックN方式、選択再送方式）がある。","a":"ARQ","aliases":["Automatic Repeat reQuest","自動再送要求"],"cat":"network"},{"q":"自律システム（AS）間で経路情報を交換するプロトコル。 インターネットの基幹で使われる。","a":"BGP","aliases":["Border Gateway Protocol"],"cat":"network"},{"q":"コンテンツを利用者に近いサーバから配信し、遅延と原本サーバの負荷を減らす仕組み。","a":"CDN","aliases":["Content Delivery Network"],"cat":"network"},{"q":"クラスにとらわれずネットワーク部の長さを指定するアドレス割当て方式。 /24 のように、ネットワーク部のビット数で表記する。","a":"CIDR","aliases":["Classless Inter-Domain Routing"],"cat":"network"},{"q":"異なる言語やOSのソフトウェア部品を、ネットワーク越しに呼び出すための分散オブジェクト規約。","a":"CORBA","aliases":["Common Object Request Broker Architecture"],"cat":"network"},{"q":"無線LANのアクセス制御方式。 送信前に一定時間待って衝突を避ける。Collision Avoidance＝衝突回避。","a":"CSMA/CA","aliases":["CSMA-CA"],"cat":"network"},{"q":"有線LAN（イーサネット）のアクセス制御方式。送信前に回線が空いているか調べ、衝突が起きたら検出してランダムな時間だけ待ち、再送する。","a":"CSMA/CD","aliases":["CSMA-CD","搬送波感知多重アクセス／衝突検出"],"cat":"network"},{"q":"Webサーバが利用者の端末に保存する小さなデータ。 セッション管理に使う。","a":"Cookie","aliases":[],"cat":"network"},{"q":"IPアドレスなどのネットワーク設定を自動的に配布するプロトコル。","a":"DHCP","aliases":["Dynamic Host Configuration Protocol"],"cat":"network"},{"q":"ドメイン名とIPアドレスを相互変換する仕組み。 キャッシュポイズニング攻撃の対象になる。","a":"DNS","aliases":["Domain Name System"],"cat":"network"},{"q":"デジタル回線の終端に置く装置。 TAは、対応していない端末をデジタル回線に接続するための変換器。","a":"DSU","aliases":["Digital Service Unit"],"cat":"network"},{"q":"ファイル転送用のプロトコル。 制御用とデータ転送用の2つのコネクションを使う。","a":"FTP","aliases":["File Transfer Protocol"],"cat":"network"},{"q":"光ファイバを家庭や事業所まで引き込む加入者回線サービス。 終端にONUを設置する。","a":"FTTH","aliases":["Fiber To The Home"],"cat":"network"},{"q":"フラグシーケンスでフレームを区切り、誤り制御と順序制御を行うデータリンク層のプロトコル。","a":"HDLC","aliases":["High-level Data Link Control"],"cat":"network"},{"q":"1つの接続で複数の要求と応答を並行してやり取りできるようにしたHTTPの版。","a":"HTTP/2","aliases":["HTTP-2"],"cat":"network"},{"q":"UDP上のQUICを土台とするHTTPの版。 パケット欠落による後続の待ちが生じにくい。","a":"HTTP/3","aliases":["HTTP-3"],"cat":"network"},{"q":"Webのデータをやり取りするプロトコル。 ステートレスで、状態はCookieで補う。","a":"HTTP","aliases":["HyperText Transfer Protocol"],"cat":"network"},{"q":"HTTPの通信をTLSで暗号化したもの。 既定のポート番号は443。","a":"HTTPS","aliases":[],"cat":"network"},{"q":"到達性の確認やエラー通知を行うプロトコル。 pingやtracerouteが利用する。","a":"ICMP","aliases":["Internet Control Message Protocol"],"cat":"network"},{"q":"無線LANの規格群。 11n以降はWi-Fi 4、5、6という通称が使われる。","a":"IEEE 802.11","aliases":[],"cat":"network"},{"q":"メールをサーバ上に置いたまま管理できる受信プロトコル。 複数端末での利用に向く。","a":"IMAP4","aliases":[],"cat":"network"},{"q":"通信事業者の閉域IP網を利用するVPN。 経路制御は事業者が行う。","a":"IP-VPN","aliases":[],"cat":"network"},{"q":"128ビットのアドレスを持つIP。アドレス枯渇を解決し、IPsecを標準で備える。","a":"IPv6","aliases":[],"cat":"network"},{"q":"ネットワーク上の機器を識別する番号。IPv4は32ビット、IPv6は128ビット。 前半が「どのネットワークか」、後半が「その中のどの機器か」を表す。","a":"IPアドレス","aliases":[],"cat":"network"},{"q":"音声をパケット化してIPネットワークで伝送する電話。 VoIP技術を用いる。","a":"IP電話","aliases":[],"cat":"network"},{"q":"ルーティング機能を専用ハードウェアで実現したスイッチ。 高速な経路制御ができる。","a":"L3スイッチ","aliases":[],"cat":"network"},{"q":"建物や敷地の中に自前で敷設するネットワーク。高速で、利用に追加費用がかからない。 〇〇〇 ＝ 構内通信網。","a":"LAN","aliases":["Local Area Network"],"cat":"network"},{"q":"低消費電力で長距離通信ができる無線方式。 IoT機器の接続に使われる。","a":"LPWA","aliases":["Low Power Wide Area"],"cat":"network"},{"q":"データ通信を前提に設計された第4世代の移動通信方式。 3Gは音声通話が主役だった。","a":"LTE","aliases":["Long Term Evolution"],"cat":"network"},{"q":"ネットワーク機器に製造時に割り当てられる48ビットの物理アドレス。 同じネットワーク（セグメント）の中で相手を識別するために使う。","a":"MACアドレス","aliases":[],"cat":"network"},{"q":"電子メールで日本語や画像などを扱えるようにする拡張規格。","a":"MIME","aliases":["Multipurpose Internet Mail Extensions"],"cat":"network"},{"q":"IoT向けの軽量なパブリッシュ／サブスクライブ型通信プロトコル。 低帯域・不安定な回線に適する。","a":"MQTT","aliases":[],"cat":"network"},{"q":"1回で送信できるデータの最大長。 超える場合はフラグメント（分割）化される。","a":"MTU","aliases":["Maximum Transmission Unit"],"cat":"network"},{"q":"プライベートIPアドレスとグローバルIPアドレスを相互変換する仕組み。 ポート番号も変換する方式がNAPT。","a":"NAT","aliases":["Network Address Translation"],"cat":"network"},{"q":"専用機器の機能をソフトウェアとして汎用サーバ上で実現する技術。","a":"NFV","aliases":["Network Functions Virtualization"],"cat":"network"},{"q":"ネットワーク経由で機器の時刻を同期させるプロトコル。 ログの相関分析に不可欠。","a":"NTP","aliases":["Network Time Protocol"],"cat":"network"},{"q":"光信号と電気信号を相互変換する〇〇〇。 FTTHで建物ごとに設置される。","a":"ONU","aliases":["Optical Network Unit","光回線終端装置"],"cat":"network"},{"q":"通信の機能を7つの階層に分けた標準モデル。 下から物理・データリンク・ネットワーク・トランスポート・セション・プレゼンテーション・アプリケーションの順。","a":"OSI基本参照モデル","aliases":[],"cat":"network"},{"q":"回線速度などのコストから最短経路を計算する、リンク状態型のルーティングプロトコル。","a":"OSPF","aliases":["Open Shortest Path First"],"cat":"network"},{"q":"電力線を通信回線として利用する技術。","a":"PLC","aliases":["Power Line Communication","電力線通信"],"cat":"network"},{"q":"メールを受信して端末側にダウンロードするプロトコル。","a":"POP3","aliases":[],"cat":"network"},{"q":"帯域や遅延を制御して、重要な通信の品質を確保する仕組み。 優先制御と帯域制御がある。","a":"QoS","aliases":["Quality of Service"],"cat":"network"},{"q":"利用者の認証情報を一元管理し、ネットワーク接続の認証を集中的に行う仕組み。","a":"RADIUS","aliases":[],"cat":"network"},{"q":"経由するルータ数を基準に経路を選ぶ距離ベクトル型のルーティングプロトコル。","a":"RIP","aliases":["Routing Information Protocol"],"cat":"network"},{"q":"拠点間WANをソフトウェアで柔軟に制御し、回線を最適に使い分ける技術。","a":"SD-WAN","aliases":[],"cat":"network"},{"q":"ネットワーク機器の制御機能とデータ転送機能を分離し、ソフトウェアで一元制御する技術。","a":"SDN","aliases":["Software-Defined Networking"],"cat":"network"},{"q":"メールの送信・転送に使うプロトコル。 受信にはPOP3やIMAP4を使う。","a":"SMTP","aliases":["Simple Mail Transfer Protocol"],"cat":"network"},{"q":"ネットワーク機器を監視・管理するプロトコル。 異常時のトラップ通知がある。","a":"SNMP","aliases":["Simple Network Management Protocol"],"cat":"network"},{"q":"XMLで記述したメッセージをやり取りするWebサービスの通信規約。","a":"SOAP","aliases":[],"cat":"network"},{"q":"無線LANのアクセスポイントを識別する名前。 ステルス化だけでは対策として不十分。","a":"SSID","aliases":[],"cat":"network"},{"q":"スイッチ間のループを検出し、片方の経路を論理的に遮断して待機させるプロトコル。 現用経路が切れたら自動で切り替える。","a":"STP","aliases":["スパニングツリープロトコル"],"cat":"network"},{"q":"コネクション型で再送制御・順序制御を行う、信頼性の高いトランスポート層プロトコル。","a":"TCP","aliases":["Transmission Control Protocol"],"cat":"network"},{"q":"コネクションレス型で再送制御を行わないプロトコル。 低遅延が求められる音声・映像配信に適する。","a":"UDP","aliases":["User Datagram Protocol"],"cat":"network"},{"q":"物理的な接続構成によらず、論理的にネットワークを分割する技術。 ブロードキャストの到達範囲を限定できる。","a":"VLAN","aliases":["Virtual LAN"],"cat":"network"},{"q":"公衆網上に暗号化された仮想的な専用線を構築する技術。 IPsecやSSL/TLSを用いる。","a":"VPN","aliases":["Virtual Private Network"],"cat":"network"},{"q":"複数のルータで仮想IPアドレスを共有し、デフォルトゲートウェイを冗長化するプロトコル。","a":"VRRP","aliases":["Virtual Router Redundancy Protocol"],"cat":"network"},{"q":"離れた拠点間を結ぶ広域ネットワーク。通信事業者から回線を借りて利用する。 〇〇〇 ＝ 広域通信網。","a":"WAN","aliases":["Wide Area Network"],"cat":"network"},{"q":"HTTPを介して外部から機能を呼び出せるインタフェース。 REST方式が主流。","a":"Web API","aliases":[],"cat":"network"},{"q":"遠隔操作のプロトコル。 telnetは平文、SSHは暗号化される。","a":"telnetとSSH","aliases":[],"cat":"network"},{"q":"インターネットの技術を、組織の内部だけで利用するネットワーク。 社内ポータルや社内Wikiなど、外部には公開しない用途で使われる。","a":"イントラネット","aliases":[],"cat":"network"},{"q":"TCPで、確認応答（ACK）を待たずに連続して送ってよいデータ量を調整する仕組み。 この「まとめて送ってよい量」をウィンドウサイズという。","a":"ウィンドウ制御","aliases":["スライディングウィンドウ","ウインドウ制御"],"cat":"network"},{"q":"0〜1023の、主要なサービスに割り当てられた予約済みポート番号。","a":"ウェルノウンポート","aliases":[],"cat":"network"},{"q":"イントラネットを、取引先など特定の外部組織にまで広げたもの。 受発注システムなど、決まった相手とだけ情報を共有する用途に使われる。","a":"エクストラネット","aliases":[],"cat":"network"},{"q":"上位層のプロトコルが異なるネットワークどうしを接続する装置。 トランスポート層より上（4〜7層）で動作する。","a":"ゲートウェイ","aliases":[],"cat":"network"},{"q":"IPアドレスのどこまでがネットワーク部で、どこからがホスト部かを示すビット列。 ネットワーク部を1、ホスト部を0で表し、255.255.255.0 や /24 と書く。","a":"サブネットマスク","aliases":[],"cat":"network"},{"q":"パケットの到着間隔のばらつき。 音声や映像の品質を劣化させる。","a":"ジッタ","aliases":[],"cat":"network"},{"q":"一連の操作を同一利用者のものとして扱うための仕組み。 IDの推測困難性が重要。","a":"セッション管理","aliases":[],"cat":"network"},{"q":"多数のセンサ端末を無線で接続し、測定値を集める仕組み。 省電力と到達距離が、速度よりも重視される。","a":"センサーネットワーク","aliases":[],"cat":"network"},{"q":"スマートフォンなどの携帯回線を経由して、PCやタブレットをインターネットへ接続する機能。 スマートフォンがモバイルルータの代わりになる。","a":"テザリング","aliases":[],"cat":"network"},{"q":"宛先の経路が分からないパケットを転送する先のルータ。","a":"デフォルトゲートウェイ","aliases":[],"cat":"network"},{"q":"どの通信が帯域をどれだけ使っているかを可視化する運用管理。 増速やQoS導入の判断に使う。","a":"トラフィック監視","aliases":[],"cat":"network"},{"q":"資源の共有と利用者認証を提供するOS。 現在はサーバOSの機能に統合されている。","a":"ネットワークOS","aliases":[],"cat":"network"},{"q":"データをパケットという小さな単位に分割し、他の通信と混ぜて送る方式。 現在のインターネットはすべてこの方式で動いている。","a":"パケット交換","aliases":[],"cat":"network"},{"q":"MACアドレスを見てフレームを中継する、データリンク層の装置。 多ポート版がスイッチングハブ（L2スイッチ）。","a":"ブリッジ","aliases":[],"cat":"network"},{"q":"ホスト部がすべて1のアドレス。 同一ネットワークの全機器宛てに送る。","a":"ブロードキャストアドレス","aliases":[],"cat":"network"},{"q":"ループしたブロードキャストが増殖して回線を埋め尽くす障害。","a":"ブロードキャストストーム","aliases":[],"cat":"network"},{"q":"組織内でのみ使えるアドレス。インターネットへはNATで変換して出る。","a":"プライベートIPアドレス","aliases":[],"cat":"network"},{"q":"クライアントに代わって外部と通信する中継サーバ。 アクセス制御やキャッシュにも使う。","a":"プロキシサーバ","aliases":[],"cat":"network"},{"q":"品質を保証せず、そのときできる範囲で最大の性能を提供するという考え方。 家庭の「最大1Gビット/秒」の光回線が、常に1Gビット/秒出るとは限らないのはこのため。","a":"ベストエフォート","aliases":[],"cat":"network"},{"q":"ホスト部のビット数をnとすると、割当て可能なホスト数は 2のn乗から2を引いた数。","a":"ホスト数の計算","aliases":[],"cat":"network"},{"q":"トランスポート層でアプリケーションを識別する番号。 HTTPは80、HTTPSは443。","a":"ポート番号","aliases":[],"cat":"network"},{"q":"機器どうしが相互に中継し合って広い範囲を覆う無線ネットワーク構成。","a":"メッシュネットワーク","aliases":[],"cat":"network"},{"q":"アナログ回線とデジタル信号を相互変換する装置（変調・復調）。","a":"モデム","aliases":[],"cat":"network"},{"q":"物理層で動作し、弱った信号を増幅・整形して距離を延ばす装置。 多ポート版がハブ。","a":"リピータ","aliases":[],"cat":"network"},{"q":"複数の物理回線を束ねて1本の論理回線として扱う技術。 帯域拡張と冗長化ができる。","a":"リンクアグリゲーション","aliases":[],"cat":"network"},{"q":"ネットワーク層でIPアドレスを見て経路制御を行う装置。 異なるネットワーク間を接続する。","a":"ルータ","aliases":[],"cat":"network"},{"q":"宛先ネットワークごとの次の転送先を記録した〇〇〇。","a":"ルーティングテーブル","aliases":["経路表"],"cat":"network"},{"q":"移動しながら接続先のアクセスポイントを切り替え、通信を継続する仕組み。","a":"ローミング","aliases":[],"cat":"network"},{"q":"回線速度に対して、実際にデータ転送に使える割合。 実効速度の計算に使う。","a":"伝送効率","aliases":[],"cat":"network"},{"q":"遅延に敏感な通信を優先して転送するQoSの手法。","a":"優先制御","aliases":[],"cat":"network"},{"q":"双方向の通信を同時に行えるのが全二重、交互にしか行えないのが半二重。","a":"全二重と半二重","aliases":[],"cat":"network"},{"q":"そこが故障するとシステム全体が停止してしまう箇所。〇〇〇（Single Point Of Failure）ともいう。","a":"単一障害点","aliases":["SPOF"],"cat":"network"},{"q":"回線の伝送能力に対する、実際の使用量の割合。 輻輳の判断材料になる。","a":"回線利用率","aliases":[],"cat":"network"},{"q":"1本の回線を複数の通信で共有する技術。 時分割のTDM、周波数分割のFDM、波長分割のWDMがある。","a":"多重化","aliases":[],"cat":"network"},{"q":"2拠点間を占有する回線。 品質は最も高いが費用も最も高い。","a":"専用線","aliases":[],"cat":"network"},{"q":"通信の種類ごとに使える帯域を割り当て、重要な通信の品質を守る仕組み。","a":"帯域制御","aliases":[],"cat":"network"},{"q":"単位時間に転送できるデータ量（単位はビット/秒）。 伝送時間はデータ量÷実効伝送速度で求める。","a":"帯域幅","aliases":[],"cat":"network"},{"q":"事業者網を介して離れた拠点をレイヤ2で接続し、同一LANのように扱えるサービス。","a":"広域イーサネット","aliases":[],"cat":"network"},{"q":"伝送中の誤りを検出・訂正する仕組み。 パリティは検出のみ、ハミング符号は訂正もできる。","a":"誤り制御","aliases":[],"cat":"network"},{"q":"1文字ごとにスタートビットとストップビットで区切る非同期の伝送方式。 同期式はブロック単位でまとめて送る。","a":"調歩同期","aliases":["非同期式"],"cat":"network"},{"q":"通信が集中して処理しきれず、遅延やパケット破棄が生じる状態。","a":"輻輳","aliases":[],"cat":"network"},{"q":"現在の標準的な共通鍵暗号方式。鍵長は128・192・256ビットから選ぶ。","a":"AES","aliases":[],"cat":"security"},{"q":"生成AIで巧妙な偽メールや偽音声を作るなど、AIを攻撃側が利用すること。","a":"AIを悪用した攻撃","aliases":[],"cat":"security"},{"q":"私物の端末を業務に利用すること。管理の徹底が求められる。","a":"BYOD","aliases":[],"cat":"security"},{"q":"感染端末に指令を送り遠隔操作するための、攻撃者側のサーバ。","a":"C&Cサーバ","aliases":["C2サーバ","Command and Controlサーバ"],"cat":"security"},{"q":"証明書失効リスト。有効期限内に失効したディジタル証明書の一覧。証明書検証時に確認する。","a":"CRL","aliases":[],"cat":"security"},{"q":"セキュリティインシデントに対応する専門組織。検知・分析・復旧・再発防止を担う。","a":"CSIRT","aliases":[],"cat":"security"},{"q":"ログイン済み利用者に、意図しないリクエストを送信させる攻撃。トークンの照合で防ぐ。","a":"CSRF","aliases":["クロスサイトリクエストフォージェリ"],"cat":"security"},{"q":"個別の脆弱性に一意の識別番号を付与する共通の採番体系。","a":"CVE","aliases":[],"cat":"security"},{"q":"共通脆弱性評価システム。脆弱性の深刻度を0.0〜10.0の共通の基準で点数化する評価手法。","a":"CVSS","aliases":[],"cat":"security"},{"q":"ソフトウェアの脆弱性の種類を分類・体系化した共通の基準。","a":"CWE","aliases":[],"cat":"security"},{"q":"DomainKeys Identified Mail。送信側がメールに電子署名を付け、受信側がDNS上の公開鍵で検証して改ざんとなりすましを防ぐ仕組み。","a":"DKIM","aliases":[],"cat":"security"},{"q":"機密データの内容を監視し、持ち出しや外部送信を防止する仕組み。","a":"DLP","aliases":[],"cat":"security"},{"q":"SPF・DKIMの検証に失敗したメールをどう扱ってほしいかを、 ドメインの持ち主がDNSで宣言する仕組み。結果のレポートも受け取れる。","a":"DMARC","aliases":[],"cat":"security"},{"q":"内部ネットワークと外部の間に設ける緩衝地帯。公開サーバを置き内部への侵入を防ぐ。","a":"DMZ","aliases":["非武装地帯"],"cat":"security"},{"q":"DNS応答にディジタル署名を付け、キャッシュポイズニングを防ぐ拡張。","a":"DNSSEC","aliases":[],"cat":"security"},{"q":"DNSサーバに偽の名前解決情報を覚え込ませ、偽サイトへ誘導する攻撃。","a":"DNSキャッシュポイズニング","aliases":[],"cat":"security"},{"q":"送信元を偽装した問合せをDNSサーバへ送り、大きな応答を標的に集中させる攻撃。DNS増幅攻撃ともいう。","a":"DNSリフレクタ攻撃","aliases":[],"cat":"security"},{"q":"大量の要求を送りサービスを停止させる攻撃。複数拠点から分散して行うものは別名で呼ばれる。","a":"DoS攻撃","aliases":[],"cat":"security"},{"q":"端末の挙動を監視し、侵入後の不審な動きを検知して対応する仕組み。","a":"EDR","aliases":[],"cat":"security"},{"q":"侵入検知システム。不正な通信や挙動を検知して管理者に通知する仕組み。遮断まで行うものはIPSという。","a":"IDS","aliases":[],"cat":"security"},{"q":"侵入防止システム。不正な通信を検知するだけでなく、遮断まで行う仕組み。","a":"IPS","aliases":[],"cat":"security"},{"q":"ネットワーク層で暗号化と認証を行うプロトコル。トンネルモードとトランスポートモードがある。","a":"IPsec","aliases":[],"cat":"security"},{"q":"政府がクラウドサービスの安全性を評価・登録する制度。","a":"ISMAP","aliases":[],"cat":"security"},{"q":"情報セキュリティマネジメントシステム。情報セキュリティを継続的に管理する仕組み。JIS Q 27001が要求事項を定める。","a":"ISMS","aliases":[],"cat":"security"},{"q":"情報セキュリティ製品の設計・実装を評価する国際規格。〇〇〇と呼ぶ。","a":"ISO/IEC 15408","aliases":["コモンクライテリア"],"cat":"security"},{"q":"標的型攻撃の被害拡大を防ぐためIPAが運営する相談・支援窓口。","a":"J-CRAT","aliases":[],"cat":"security"},{"q":"国内のインシデント報告を受け付け、調整や注意喚起を行う組織。","a":"JPCERT/CC","aliases":[],"cat":"security"},{"q":"業務で使う携帯端末を一元管理し、遠隔ロックや消去を行う仕組み。","a":"MDM","aliases":[],"cat":"security"},{"q":"利用者のブラウザに侵入し、正規の通信内容を送信直前に書き換える攻撃。","a":"MITB攻撃","aliases":["Man-in-the-Browser攻撃"],"cat":"security"},{"q":"内閣サイバーセキュリティセンター（National center of Incident readiness and Strategy for Cybersecurity）。 国のサイバーセキュリティ戦略を立案・推進する、内閣官房に置かれた中核組織。","a":"NISC","aliases":[],"cat":"security"},{"q":"利用者のパスワードを渡さずに、他サービスへ限定的な権限を委譲する仕組み。認可（Authorization）の規格であり、認証ではない。","a":"OAuth","aliases":[],"cat":"security"},{"q":"ディジタル証明書の失効状態をオンラインでリアルタイムに問い合わせるプロトコル。CRLより即時性が高い。","a":"OCSP","aliases":[],"cat":"security"},{"q":"ISPが外部への25番ポート宛て通信を遮断し、迷惑メールの送信を抑える対策。","a":"OP25B","aliases":[],"cat":"security"},{"q":"OAuthを基盤に、利用者の認証結果を安全に受け渡す仕組み。「Googleでログイン」のようなID連携を実現する。","a":"OpenID Connect","aliases":[],"cat":"security"},{"q":"クレジットカード会員データを安全に扱うための業界セキュリティ基準。","a":"PCI DSS","aliases":[],"cat":"security"},{"q":"公開鍵基盤。認証局が発行するディジタル証明書によって、公開鍵の持ち主が本物であることを保証する仕組み全体。","a":"PKI","aliases":[],"cat":"security"},{"q":"大きな素因数分解の困難性を安全性の根拠とする公開鍵暗号方式。","a":"RSA","aliases":[],"cat":"security"},{"q":"電子メールの暗号化とディジタル署名を行う方式。ディジタル証明書を用いる。","a":"S/MIME","aliases":[],"cat":"security"},{"q":"組織をまたいで認証情報を安全に受け渡す規格。シングルサインオンに用いる。","a":"SAML","aliases":[],"cat":"security"},{"q":"256ビットのハッシュ値を生成する関数。衝突困難性が求められる。","a":"SHA-256","aliases":[],"cat":"security"},{"q":"各種機器のログを統合的に収集・相関分析して脅威を検知する仕組み。","a":"SIEM","aliases":[],"cat":"security"},{"q":"メール送信時に利用者認証を行い、不正な中継を防ぐ仕組み。","a":"SMTP-AUTH","aliases":[],"cat":"security"},{"q":"ログを常時監視してサイバー攻撃を検知・分析する専門組織。","a":"SOC","aliases":[],"cat":"security"},{"q":"送信元メールサーバのIPアドレスをDNSに登録し、受信側が照合してなりすましを検知する仕組み。","a":"SPF","aliases":[],"cat":"security"},{"q":"入力値にSQL文の断片を混入させて、データベースに意図しない命令を実行させる攻撃。プレースホルダで防ぐ。","a":"SQLインジェクション","aliases":["SQLi"],"cat":"security"},{"q":"通信経路を暗号化しサーバを認証するプロトコル。HTTPSで使われる。","a":"SSL/TLS","aliases":[],"cat":"security"},{"q":"接続要求だけを大量に送り、サーバの接続待ち資源を枯渇させる攻撃。","a":"SYNフラッド攻撃","aliases":[],"cat":"security"},{"q":"暗号鍵を安全に保管する機能を持つ、端末に搭載される専用チップ。","a":"TPM","aliases":[],"cat":"security"},{"q":"ファイアウォールやアンチウイルスなど複数の機能を1台に統合した機器。","a":"UTM","aliases":[],"cat":"security"},{"q":"Webアプリケーションへの通信内容（HTTPの中身）を検査して攻撃を遮断する仕組み。","a":"WAF","aliases":[],"cat":"security"},{"q":"無線LANの暗号化規格。WPA2の脆弱性に対応し、より強固な認証方式を採用する。","a":"WPA3","aliases":[],"cat":"security"},{"q":"資源ごとに、誰にどの操作を許すかを定義した一覧。","a":"アクセス制御リスト","aliases":["ACL"],"cat":"security"},{"q":"透明な要素を重ねて、利用者に意図しないクリックをさせる攻撃。","a":"クリックジャッキング","aliases":[],"cat":"security"},{"q":"他人の計算資源を無断で暗号資産（仮想通貨）の採掘（マイニング）に使う攻撃。","a":"クリプトジャッキング","aliases":[],"cat":"security"},{"q":"攻撃者が仕込んだスクリプトを、他の利用者のブラウザで実行させる攻撃。Cookie窃取などに使われる。出力時のエスケープで防ぐ。","a":"クロスサイトスクリプティング","aliases":["XSS"],"cat":"security"},{"q":"イメージの脆弱性検査や権限の最小化など、コンテナ環境に特有の対策。","a":"コンテナセキュリティ","aliases":[],"cat":"security"},{"q":"消費電力や処理時間などの物理的な情報から、暗号鍵を推定する攻撃。暗号アルゴリズム自体を数学的に解くわけではない。","a":"サイドチャネル攻撃","aliases":[],"cat":"security"},{"q":"特別な意味を持つ文字を無害な文字列に置き換える処理。〇〇〇ともいう。","a":"サニタイジング","aliases":["エスケープ処理"],"cat":"security"},{"q":"取引先や委託先、部品や更新経路を経由して本来の標的に侵入する攻撃。","a":"サプライチェーン攻撃","aliases":[],"cat":"security"},{"q":"組織の許可なく従業員が業務に使うIT機器やサービス。情報漏えいのリスクになる。","a":"シャドーIT","aliases":[],"cat":"security"},{"q":"一度の認証で複数のシステムを利用できる仕組み。SAMLやリバースプロキシで実現する。","a":"シングルサインオン","aliases":["SSO"],"cat":"security"},{"q":"通信の状態（コネクションの文脈）を記憶し、前後の関係を踏まえて通過可否を判断するファイアウォールの方式。","a":"ステートフルインスペクション","aliases":[],"cat":"security"},{"q":"データを1ビットまたは1バイトずつ逐次暗号化する方式。ブロック暗号は固定長単位。","a":"ストリーム暗号","aliases":[],"cat":"security"},{"q":"ハッシュ計算を何度も繰り返して、解析に要する時間を引き延ばす対策。ソルトと併用してパスワードを守る。","a":"ストレッチング","aliases":[],"cat":"security"},{"q":"利用者に気付かれずに情報を収集して外部へ送信するソフトウェア。","a":"スパイウェア","aliases":[],"cat":"security"},{"q":"脆弱性を作り込まないコーディング作法。境界検査や適切なエラー処理を含む。","a":"セキュアプログラミング","aliases":[],"cat":"security"},{"q":"セッションIDを盗んで正規利用者になりすます攻撃。","a":"セッションハイジャック","aliases":[],"cat":"security"},{"q":"脆弱性の修正プログラムが提供される前に行われる攻撃。","a":"ゼロデイ攻撃","aliases":[],"cat":"security"},{"q":"社内外を問わずすべてのアクセスを信頼せず、都度検証するセキュリティの考え方（Never Trust, Always Verify）。","a":"ゼロトラスト","aliases":[],"cat":"security"},{"q":"パスワードをハッシュ化する前に混ぜる、利用者ごとに異なるランダムな文字列。 同じパスワードでも保存される値が全員バラバラになり、レインボー攻撃を無効化する。","a":"ソルト","aliases":["salt"],"cat":"security"},{"q":"技術ではなく人の心理や行動の隙を突いて情報を得る手口。","a":"ソーシャルエンジニアリング","aliases":[],"cat":"security"},{"q":"電子データがある時刻に存在し、以後改ざんされていないことを証明する仕組み。","a":"タイムスタンプ","aliases":[],"cat":"security"},{"q":"サーバが毎回異なる乱数（チャレンジ）を送り、利用者はその乱数への応答（レスポンス）を返すことで、パスワードそのものを流さずに認証する方式。","a":"チャレンジレスポンス方式","aliases":[],"cat":"security"},{"q":"不正の証拠となるデータを保全・分析する技術。証拠能力の維持が要点。","a":"ディジタルフォレンジックス","aliases":[],"cat":"security"},{"q":"送信者が自分の秘密鍵で文書のハッシュ値を暗号化して付けたもの。 受信者は送信者の公開鍵で検証し、「本人が送った」「改ざんされていない」ことを確認できる。","a":"ディジタル署名","aliases":["デジタル署名"],"cat":"security"},{"q":"公開鍵の持ち主を認証局が保証する電子的な証明書。","a":"ディジタル証明書","aliases":[],"cat":"security"},{"q":"相対パスを悪用して公開範囲外のファイルを読み出す攻撃。","a":"ディレクトリトラバーサル","aliases":[],"cat":"security"},{"q":"正規のソフトウェアを装って侵入し、内部で不正な動作を行うマルウェア。ウイルスと違い、自己増殖はしない。","a":"トロイの木馬","aliases":[],"cat":"security"},{"q":"Webサイトの閲覧だけでマルウェアを自動的にダウンロードさせる攻撃。","a":"ドライブバイダウンロード","aliases":[],"cat":"security"},{"q":"本文を共通鍵暗号方式で暗号化し、その共通鍵を公開鍵暗号方式で相手に送る方式。速度と鍵配送の両方を解決する。","a":"ハイブリッド暗号","aliases":[],"cat":"security"},{"q":"任意長のデータを固定長の値（ハッシュ値）に変換する一方向性の関数。改ざん検知やパスワード保管に使う。","a":"ハッシュ関数","aliases":[],"cat":"security"},{"q":"攻撃を誘い込んで手口を観察するためのおとりのシステム。","a":"ハニーポット","aliases":[],"cat":"security"},{"q":"領域を超える入力で隣接メモリを破壊し、任意コードを実行させる攻撃。","a":"バッファオーバフロー","aliases":[],"cat":"security"},{"q":"送信元・宛先・ポート番号などを条件に通信の可否を判断する方式。","a":"パケットフィルタリング","aliases":[],"cat":"security"},{"q":"他所で漏えいしたIDとパスワードの組を使い回して不正ログインする攻撃。","a":"パスワードリスト攻撃","aliases":[],"cat":"security"},{"q":"パスワードを使わず、生体情報や機器内の鍵で認証する方式。FIDOが代表例で、原理的にフィッシングに強い。","a":"パスワードレス認証","aliases":["FIDO2","パスキー"],"cat":"security"},{"q":"IPアドレスとポート番号を条件に、通信を通すか遮断するかを判断する仕組み。通信の中身は検査しない。","a":"ファイアウォール","aliases":["FW"],"cat":"security"},{"q":"想定外のデータを大量に入力して脆弱性を検出する検査手法。","a":"ファジング","aliases":[],"cat":"security"},{"q":"DNSの情報を書き換え、正規のURLを入力しても偽サイトへ誘導する攻撃。","a":"ファーミング","aliases":[],"cat":"security"},{"q":"正規を装ったメールやサイトで認証情報をだまし取る攻撃。","a":"フィッシング","aliases":[],"cat":"security"},{"q":"異常なものを正常と判定して見逃すこと。〇〇〇という。","a":"フォールスネガティブ","aliases":["検知漏れ"],"cat":"security"},{"q":"正常なものを誤って異常と判定すること。〇〇〇という。","a":"フォールスポジティブ","aliases":["誤検知"],"cat":"security"},{"q":"攻撃の前段階として、公開情報から標的の情報を収集する行為。","a":"フットプリンティング","aliases":[],"cat":"security"},{"q":"総当たりでパスワードを試す攻撃。IDの側を総当たりするのが逆〇〇〇。","a":"ブルートフォース攻撃","aliases":["総当たり攻撃"],"cat":"security"},{"q":"JIS Q 15001に適合し個人情報を適切に扱う事業者に付与される認定制度。","a":"プライバシーマーク","aliases":[],"cat":"security"},{"q":"SQL文の値部分を後から安全に埋め込む仕組み。SQLインジェクション対策の基本。","a":"プレースホルダ","aliases":[],"cat":"security"},{"q":"実際に侵入を試みて脆弱性の悪用可能性を検証するテスト。","a":"ペネトレーションテスト","aliases":[],"cat":"security"},{"q":"マルウェアに感染した多数の端末が、攻撃者の指令下に置かれた集合体。","a":"ボットネット","aliases":[],"cat":"security"},{"q":"感染のたびに自身のコードを変化させ、検知を逃れるマルウェア。","a":"ポリモーフィック型マルウェア","aliases":[],"cat":"security"},{"q":"稼働中のサービスや脆弱性を調べるために、ポートの応答を順に確認する行為。","a":"ポートスキャン","aliases":[],"cat":"security"},{"q":"共通鍵とメッセージから生成する検証値（〇〇〇）。改ざんの検知に用いるが、共通鍵を使うため否認防止はできない。","a":"メッセージ認証符号","aliases":["MAC"],"cat":"security"},{"q":"データを暗号化して、復号と引き換えに金銭を要求するマルウェア。近年は暗号化前にデータを盗み「公開する」と脅す二重脅迫が主流。","a":"ランサムウェア","aliases":[],"cat":"security"},{"q":"リスク特定・リスク分析・リスク評価の一連のプロセス。対応を決める前段の、リスクを把握し評価するまでの活動。","a":"リスクアセスメント","aliases":[],"cat":"security"},{"q":"対策により発生確率や被害額を下げる対応。回避・移転・保有と並ぶ選択肢。","a":"リスク低減","aliases":["リスク軽減"],"cat":"security"},{"q":"対策費用に見合わない小さなリスクを、あえて受け入れる対応。","a":"リスク保有","aliases":["リスク受容"],"cat":"security"},{"q":"リスク源となる活動そのものをやめて、リスクをなくす対応。","a":"リスク回避","aliases":[],"cat":"security"},{"q":"保険加入や業務委託によりリスクを第三者に移す対応。リスク回避・リスク低減・リスク保有と並ぶリスク対応の4分類の1つ。","a":"リスク移転","aliases":["リスク共有"],"cat":"security"},{"q":"外部からの要求を受けて内部サーバへ中継するサーバ。公開サーバを隠蔽できる。","a":"リバースプロキシ","aliases":[],"cat":"security"},{"q":"盗聴した認証データをそのまま再送して不正にアクセスする攻撃。","a":"リプレイ攻撃","aliases":[],"cat":"security"},{"q":"侵入の痕跡やマルウェアの存在を隠蔽するツール群。","a":"ルートキット","aliases":[],"cat":"security"},{"q":"ハッシュ値と平文パスワードの対応表（レインボーテーブル）を事前に用意し、盗んだハッシュ値から高速に元のパスワードを割り出す攻撃。ソルトで防ぐ。","a":"レインボー攻撃","aliases":["レインボーテーブル攻撃"],"cat":"security"},{"q":"役割に権限を割り当て、利用者を役割に所属させて管理する方式。","a":"ロールベースアクセス制御","aliases":["RBAC"],"cat":"security"},{"q":"一度限り有効なパスワード。盗聴されても再利用できない。","a":"ワンタイムパスワード","aliases":["OTP"],"cat":"security"},{"q":"単独で自己増殖し、ネットワーク経由で拡散するマルウェア。ウイルスと違い、寄生する宿主プログラムを必要としない。","a":"ワーム","aliases":[],"cat":"security"},{"q":"通信経路に割り込んで盗聴・改ざんを行う攻撃。証明書検証で検知できる。","a":"中間者攻撃","aliases":["MITM"],"cat":"security"},{"q":"入力データの型・長さ・範囲・書式を検査し、不正なデータを排除する対策。","a":"入力値検証","aliases":[],"cat":"security"},{"q":"公開鍵で暗号化し、対になる秘密鍵で復号する方式。鍵配送問題を解決できるが、共通鍵暗号より処理は低速。","a":"公開鍵暗号方式","aliases":["非対称鍵暗号方式"],"cat":"security"},{"q":"暗号化と復号に同じ鍵を使う暗号方式。高速だが、n人が相互に通信するにはn(n−1)/2個の鍵が必要になる。","a":"共通鍵暗号方式","aliases":["対称鍵暗号方式"],"cat":"security"},{"q":"従業員や委託先など、正規の権限を持つ者による情報の持出しや悪用。","a":"内部不正","aliases":[],"cat":"security"},{"q":"必要なときにシステムや情報を利用できる性質。機密性・完全性と合わせて情報セキュリティの3要素（CIA）と呼ばれる。","a":"可用性","aliases":[],"cat":"security"},{"q":"行為を後から否定されないよう証拠を残す性質。ディジタル署名で確保する。","a":"否認防止","aliases":[],"cat":"security"},{"q":"性質の異なる対策を重ねて、1つが破られても被害に至らせない考え方。","a":"多層防御","aliases":[],"cat":"security"},{"q":"知識・所持・生体のうち2種類以上を組み合わせる認証。単なる2段階認証（同じ種類を2回聞くだけ）とは区別される。","a":"多要素認証","aliases":["MFA"],"cat":"security"},{"q":"情報が正確であり、改ざんされていない性質。機密性・可用性と合わせて情報セキュリティの3要素（CIA）と呼ばれる。","a":"完全性","aliases":[],"cat":"security"},{"q":"基本方針・対策基準・実施手順の階層で構成される組織の規程体系。","a":"情報セキュリティポリシー","aliases":[],"cat":"security"},{"q":"組織にとって価値のある情報とその媒体。台帳で洗い出し重要度を分類する。","a":"情報資産","aliases":[],"cat":"security"},{"q":"AIモデルに誤認識を起こさせるよう細工した入力データ。AI自体への攻撃手段。","a":"敵対的サンプル","aliases":[],"cat":"security"},{"q":"業務に必要な最小限の権限だけを与える考え方。被害範囲を限定できる。","a":"最小権限の原則","aliases":[],"cat":"security"},{"q":"正当な本人を誤って拒否してしまう割合（〇〇〇）。他人受入率（FAR）とはトレードオフの関係にある。","a":"本人拒否率","aliases":["FRR"],"cat":"security"},{"q":"セキュリティ要件を満たさない端末を隔離し、社内網に接続させない仕組み。","a":"検疫ネットワーク","aliases":[],"cat":"security"},{"q":"RSAより短い鍵で同等の強度が得られる公開鍵暗号方式。計算資源の限られる機器に向く。","a":"楕円曲線暗号","aliases":["ECC"],"cat":"security"},{"q":"特定の組織を狙い、業務を装ったメール等で長期間侵入する攻撃。","a":"標的型攻撃","aliases":[],"cat":"security"},{"q":"認可された者だけが情報にアクセスできる性質。完全性・可用性と合わせて情報セキュリティの3要素（CIA）と呼ばれる。","a":"機密性","aliases":[],"cat":"security"},{"q":"標的が閲覧しそうなWebサイトを改ざんして待ち伏せる攻撃。","a":"水飲み場型攻撃","aliases":[],"cat":"security"},{"q":"指紋や虹彩など身体的特徴で本人を識別する認証。","a":"生体認証","aliases":[],"cat":"security"},{"q":"利用者や情報が本物であることを確実にする性質。責任追跡性・否認防止・信頼性と合わせて7要素（CIA＋4つ）とされる。","a":"真正性","aliases":[],"cat":"security"},{"q":"損失の原因が脅威、それを突かれる弱点が脆弱性、両者の組合せで生じる損失可能性がリスク。","a":"脅威・脆弱性・リスク","aliases":[],"cat":"security"},{"q":"ディジタル証明書の発行・失効を行う信頼できる第三者機関。〇〇〇という。","a":"認証局","aliases":["CA"],"cat":"security"},{"q":"誰がいつ何をしたかを追跡できる性質。ログ管理により確保する。","a":"責任追跡性","aliases":[],"cat":"security"},{"q":"計算機性能の向上などにより、鍵が現実的な時間で破られる状態になること。","a":"鍵の危殆化","aliases":[],"cat":"security"}];

const CATS = [
  { id: "all",      label: "全部" },
  { id: "database", label: "データベース" },
  { id: "network",  label: "ネットワーク" },
  { id: "security", label: "セキュリティ" },
];

/* ---------- 埋め込みモード ---------- */
/*
 * Quartzのカテゴリページはこのファイルを同一オリジンのiframeで読み込む。
 * その場合はヘッダーを隠し、テーマは親ページ（Quartz）に追従させる。
 */
const EMBED = window.self !== window.top;
if (EMBED) document.documentElement.classList.add("embed");

/* 中身の高さにiframe自体を合わせる（同一オリジンなので frameElement を触れる）。
   固定高だと問題文の長短や結果画面で余白・スクロールが出るため。 */
function fitEmbed() {
  if (!EMBED) return;
  try {
    const h = document.querySelector(".app").getBoundingClientRect().height;
    if (h > 0) window.frameElement.style.height = Math.ceil(h) + "px";
  } catch (e) {} // 別オリジンなら諦めてCSSの高さのままにする
}

/* ---------- テーマ ---------- */
const THEME_KEY = "ap-flashcards-theme";
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  // 埋め込み時は親に従うだけなので、全画面表示側の選択を上書きしない
  if (!EMBED) { try { localStorage.setItem(THEME_KEY, t); } catch (e) {} }
}
/*
 * 親（Quartz）が選んでいるテーマを読む。
 * Quartz v5 のテーマトグルは :root に saved-theme を付ける（2026-08-04 実測）。
 * data-theme も見るのは、将来Quartz側の属性名が変わった場合の保険。
 */
function parentTheme() {
  try {
    const root = window.parent.document.documentElement;
    const t = root.getAttribute("saved-theme") || root.getAttribute("data-theme");
    return t === "light" || t === "dark" ? t : null;
  } catch (e) {
    return null; // 別オリジンに埋め込まれた場合
  }
}
(function initTheme() {
  let saved = null;
  if (EMBED) {
    saved = parentTheme();
  } else {
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  }
  if (saved !== "light" && saved !== "dark") {
    saved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
      ? "dark" : "light";
  }
  applyTheme(saved);
})();
document.getElementById("theme").addEventListener("click", () => {
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
});
/* 親でテーマが切り替わったら追従する（イベント名に依存しないよう属性を直接監視する） */
if (EMBED) {
  try {
    new MutationObserver(() => {
      const t = parentTheme();
      if (t) applyTheme(t);
    }).observe(window.parent.document.documentElement, {
      attributes: true,
      attributeFilter: ["saved-theme", "data-theme"],
    });
  } catch (e) {}
}

/* ---------- 状態 ---------- */
/*
 * カテゴリは URL のハッシュ（#security）で指定する。
 * Quartz のリンク変換は Markdown 中の相対リンクからクエリ文字列の "?" を落としてしまうため、
 * クエリではなくハッシュを使う（2026-08-04 ビルド実測で確認）。
 * 直接 ?cat=... と打たれた場合にも一応対応しておく。
 */
function readCat() {
  const h = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
  if (CATS.some((c) => c.id === h)) return h;
  const q = new URLSearchParams(location.search).get("cat");
  return CATS.some((c) => c.id === q) ? q : "all";
}
let cat = readCat();

let deck = [], idx = 0, revealed = false;
let known = new Set(), unknown = new Set();

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pool() {
  return cat === "all" ? CARDS.slice() : CARDS.filter((c) => c.cat === cat);
}

function start(cards) {
  deck = shuffle(cards.slice());
  idx = 0;
  revealed = false;
  known = new Set();
  unknown = new Set();
  render();
}

/* ---------- 描画 ---------- */
const stage = document.getElementById("stage");

function renderCats() {
  const nav = document.getElementById("cats");
  nav.innerHTML = "";
  for (const c of CATS) {
    const n = c.id === "all" ? CARDS.length : CARDS.filter((x) => x.cat === c.id).length;
    const a = document.createElement("a");
    a.className = "cat";
    a.href = "#" + c.id;
    a.textContent = c.label + " " + n;
    if (c.id === cat) a.setAttribute("aria-current", "true");
    nav.appendChild(a);
  }
  const cur = CATS.find((c) => c.id === cat);
  document.getElementById("catName").textContent = cur ? cur.label : "";
}

function renderProgress() {
  document.getElementById("pos").textContent = deck.length ? Math.min(idx + 1, deck.length) : 0;
  document.getElementById("total").textContent = deck.length;
  const pct = deck.length ? ((idx + (revealed ? 1 : 0)) / deck.length) * 100 : 0;
  document.getElementById("bar").style.width = Math.min(pct, 100) + "%";
}

function render() {
  renderProgress();

  if (!deck.length) {
    stage.innerHTML = '<p class="empty">このカテゴリにカードがありません。</p>';
    return;
  }
  if (idx >= deck.length) return renderResult();

  const c = deck[idx];
  stage.innerHTML = "";

  const card = document.createElement("div");
  card.className = "card";
  card.id = "card";

  const q = document.createElement("p");
  q.className = "q";
  q.textContent = c.q;
  card.appendChild(q);

  if (revealed) {
    const ans = document.createElement("div");
    ans.className = "answer";
    const term = document.createElement("p");
    term.className = "term";
    term.textContent = c.a;
    ans.appendChild(term);
    if (c.aliases && c.aliases.length) {
      const al = document.createElement("p");
      al.className = "aliases";
      al.textContent = "別名：" + c.aliases.join("／");
      ans.appendChild(al);
    }
    card.appendChild(ans);
  } else {
    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = "タップして答えを見る";
    card.appendChild(hint);
  }

  card.addEventListener("click", () => {
    if (!revealed) { revealed = true; render(); }
  });
  stage.appendChild(card);

  /* 操作ボタン */
  const ctr = document.createElement("div");
  ctr.className = "controls";

  if (!revealed) {
    const b = document.createElement("button");
    b.className = "act grow";
    b.id = "reveal";
    b.type = "button";
    b.textContent = "答えを見る";
    b.addEventListener("click", () => { revealed = true; render(); });
    ctr.appendChild(b);
  } else {
    const bu = document.createElement("button");
    bu.className = "act unknown grow";
    bu.id = "mark-unknown";
    bu.type = "button";
    bu.textContent = "まだ";
    bu.addEventListener("click", () => mark(false));
    ctr.appendChild(bu);

    const bk = document.createElement("button");
    bk.className = "act known grow";
    bk.id = "mark-known";
    bk.type = "button";
    bk.textContent = "覚えた";
    bk.addEventListener("click", () => mark(true));
    ctr.appendChild(bk);
  }
  stage.appendChild(ctr);

  /* 補助操作 */
  const sub = document.createElement("div");
  sub.className = "sub";

  const back = document.createElement("button");
  back.className = "link";
  back.id = "prev";
  back.type = "button";
  back.textContent = "← 前のカード";
  back.disabled = idx === 0;
  back.style.visibility = idx === 0 ? "hidden" : "visible";
  back.addEventListener("click", () => { idx--; revealed = false; render(); });
  sub.appendChild(back);

  const sh = document.createElement("button");
  sh.className = "link";
  sh.id = "shuffle";
  sh.type = "button";
  sh.textContent = "シャッフルして最初から";
  sh.addEventListener("click", () => start(pool()));
  sub.appendChild(sh);

  stage.appendChild(sub);
}

function mark(ok) {
  const c = deck[idx];
  (ok ? known : unknown).add(c.a);
  (ok ? unknown : known).delete(c.a);
  idx++;
  revealed = false;
  render();
}

function renderResult() {
  document.getElementById("bar").style.width = "100%";
  stage.innerHTML = "";

  const box = document.createElement("div");
  box.className = "result";
  box.id = "result";

  const h = document.createElement("h2");
  h.textContent = "1周おつかれさまでした";
  box.appendChild(h);

  const sc = document.createElement("div");
  sc.className = "score";
  sc.innerHTML =
    '<div class="k"><b id="cnt-known">' + known.size + "</b>覚えた</div>" +
    '<div class="u"><b id="cnt-unknown">' + unknown.size + "</b>まだ</div>";
  box.appendChild(sc);

  const ctr = document.createElement("div");
  ctr.className = "controls";

  if (unknown.size) {
    const again = document.createElement("button");
    again.className = "act unknown grow";
    again.id = "retry-unknown";
    again.type = "button";
    again.textContent = "「まだ」の " + unknown.size + " 枚をもう一度";
    again.addEventListener("click", () => {
      start(CARDS.filter((c) => unknown.has(c.a)));
    });
    ctr.appendChild(again);
  }

  const all = document.createElement("button");
  all.className = "act grow";
  all.id = "retry-all";
  all.type = "button";
  all.textContent = "最初から";
  all.addEventListener("click", () => start(pool()));
  ctr.appendChild(all);

  box.appendChild(ctr);
  stage.appendChild(box);
}

/* ---------- キーボード ---------- */
document.addEventListener("keydown", (e) => {
  if (idx >= deck.length) return;
  if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    if (!revealed) { revealed = true; render(); }
  } else if (revealed && (e.key === "1" || e.key === "j")) {
    mark(true);
  } else if (revealed && (e.key === "2" || e.key === "f")) {
    mark(false);
  } else if (e.key === "ArrowLeft" && idx > 0) {
    idx--; revealed = false; render();
  }
});

/* ---------- ハッシュでのカテゴリ切替 ---------- */
window.addEventListener("hashchange", () => {
  const next = readCat();
  if (next === cat) return;
  cat = next;
  renderCats();
  start(pool());
});

/* ---------- 起動 ---------- */
renderCats();
start(pool());

/* 描画のたびに高さを合わせ直す（カードの行数や結果画面で変わるため） */
if (EMBED) {
  new ResizeObserver(fitEmbed).observe(document.querySelector(".app"));
  fitEmbed();
}
</script>
</body>
</html>
